<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pravia Mini-Books — QR print sheet (US Letter)</title>
  <style>
    @page { size: letter portrait; margin: 0.4in; }
    * { box-sizing: border-box; }
    body {
      font-family: "Nunito Sans", system-ui, sans-serif;
      margin: 0;
      color: #002107;
    }
    h1 {
      font-family: Quicksand, system-ui, sans-serif;
      font-size: 14pt;
      text-align: center;
      margin: 0 0 8px;
      color: #b71422;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      height: 9.7in;
    }
    .card {
      border: 2px dashed #4c96fe;
      border-radius: 12px;
      padding: 6px 8px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      break-inside: avoid;
    }
    .card img {
      width: 1.55in;
      height: 1.55in;
    }
    .name {
      font-family: Quicksand, system-ui, sans-serif;
      font-weight: 700;
      margin: 0 0 4px;
      font-size: 14pt;
      color: #005db8;
      line-height: 1.1;
    }
    .code { margin: 6px 0 0; font-size: 8pt; letter-spacing: 0.06em; font-family: ui-monospace, monospace; color: #5b403e; }
    @media print {
      .noprint { display: none !important; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <p class="noprint" style="text-align:center;font-size:13px;margin:10px">
    Open this file in a browser → Print → paper <strong>Letter</strong>, scale <strong>100%</strong>, margins default.
  </p>
  <h1>Pravia's Mini-Books — Classmate QR codes</h1>
  <div class="grid">

    <article class="card">
      <p class="name">Mateo</p>
      <img src="qrs/ajolote-mateo.png" alt="QR for Mateo" />
      <p class="code">7XDVYZGL</p>
    </article>

    <article class="card">
      <p class="name">Hector</p>
      <img src="qrs/caballero-hector.png" alt="QR for Hector" />
      <p class="code">72PYXPGB</p>
    </article>

    <article class="card">
      <p class="name">Emma</p>
      <img src="qrs/caballo-emma.png" alt="QR for Emma" />
      <p class="code">W4AXKM89</p>
    </article>

    <article class="card">
      <p class="name">Celeste</p>
      <img src="qrs/capibara-celeste.png" alt="QR for Celeste" />
      <p class="code">LZ47KKJC</p>
    </article>

    <article class="card">
      <p class="name">Cata</p>
      <img src="qrs/chiwuawua-cata.png" alt="QR for Cata" />
      <p class="code">W2RQGPRA</p>
    </article>

    <article class="card">
      <p class="name">Tessa</p>
      <img src="qrs/puccini-tessa.png" alt="QR for Tessa" />
      <p class="code">UKU9343P</p>
    </article>

    <article class="card">
      <p class="name">Felipe</p>
      <img src="qrs/pug-felipe.png" alt="QR for Felipe" />
      <p class="code">CDTZABXB</p>
    </article>

    <article class="card">
      <p class="name">Barrantes</p>
      <img src="qrs/squishi-barrantes.png" alt="QR for Barrantes" />
      <p class="code">LFZSHCFK</p>
    </article>

    <article class="card">
      <p class="name">Samantha</p>
      <img src="qrs/teddy-samantha.png" alt="QR for Samantha" />
      <p class="code">KPEGW3FA</p>
    </article>
  </div>
</body>
</html>
