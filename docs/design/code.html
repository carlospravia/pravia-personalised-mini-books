<style>
        body {
            background-color: theme('colors.surface');
            /* Playful dot pattern background */
            background-image: radial-gradient(theme('colors.surface-container-high') 2px, transparent 2px);
            background-size: 24px 24px;
        }
        
        .toy-frame {
            border: 8px dashed theme('colors.secondary-container');
            box-shadow: 0 12px 0 0 theme('colors.secondary');
            transition: all 0.2s ease;
        }
        
        .toy-frame:hover {
            transform: translateY(4px);
            box-shadow: 0 8px 0 0 theme('colors.secondary');
        }
        
        /* Star animation */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        
        .star {
            position: absolute;
            color: theme('colors.tertiary-fixed');
            animation: twinkle 3s infinite ease-in-out;
        }
        
        .star-1 { top: 15%; left: 10%; animation-delay: 0s; font-size: 2rem; }
        .star-2 { top: 25%; right: 15%; animation-delay: 1s; font-size: 1.5rem; }
        .star-3 { bottom: 20%; left: 20%; animation-delay: 0.5s; font-size: 1.8rem; }
        .star-4 { bottom: 30%; right: 10%; animation-delay: 1.5s; font-size: 2.2rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-on-surface overflow-x-hidden">
<!-- Decorative Stars -->
<span class="material-symbols-outlined star star-1" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined star star-2" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined star star-3" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined star star-4" style="font-variation-settings: 'FILL' 1;">star</span>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop w-full max-w-container-max mx-auto relative z-10">
<!-- Welcome Header -->
<header class="text-center mb-gutter md:mb-margin-desktop max-w-2xl px-unit">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary drop-shadow-md mb-unit">
                Thanks for buying a Pravia's Personalized Mini-Book!
            </h1>
<p class="font-headline-md text-headline-md text-on-surface-variant">
                Here is your welcome gift <span class="material-symbols-outlined align-middle text-primary" style="font-variation-settings: 'FILL' 1;">sentiment_very_satisfied</span>
</p>
</header>
<!-- Gift Canvas Area -->
<section class="w-full max-w-lg mb-gutter md:mb-margin-desktop px-margin-mobile">
<div class="toy-frame rounded-xl bg-surface-container-lowest p-unit overflow-hidden aspect-square relative group cursor-pointer">
<!-- Using the requested placeholder directly -->
<img alt="Welcome Gift Drawing" class="w-full h-full object-cover rounded-lg group-hover:scale-105 transition-transform duration-500 ease-out" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2mtEo0RAcyVSLTBKuvbBzlIAd1w4aPkhFzignIX_lUmKp7A9fmROYsKEf8zZ-6VObe_YoDXPp0eRi1HokohkTS9lJYfM5QZUVAKY9M3p2ZrwEGqCjrDBaQ3d5_4rmwwSqOkT6_tBBbZ_6C_AzEQWtN1TLL9hQCw6yU8TswhkPZyhCocSo6i6qt8xtw3SJgUlhOghSSnn6APA0g0Uc-dUkvUh4QsrNt7RXHY-Y-ISvGuFvWBBe0YnAMVi1qbJr5jB3dpI"/>
<!-- Corner Decorations inside frame -->
<div class="absolute top-4 left-4 w-6 h-6 rounded-full bg-error-container border-2 border-error"></div>
<div class="absolute top-4 right-4 w-6 h-6 rounded-full bg-secondary-fixed border-2 border-secondary"></div>
<div class="absolute bottom-4 left-4 w-6 h-6 rounded-full bg-tertiary-fixed border-2 border-tertiary"></div>
<div class="absolute bottom-4 right-4 w-6 h-6 rounded-full bg-primary-fixed border-2 border-primary"></div>
</div>
</section>
<!-- Farewell Message -->
<footer class="text-center px-margin-mobile bg-surface-container py-gutter px-margin-desktop rounded-full border-4 border-surface-variant shadow-sm transform hover:scale-105 transition-transform">
<p class="font-headline-md text-headline-md text-secondary">
                Hope you enjoy it!
                <br/>
<span class="font-label-bold text-label-bold text-primary mt-unit inline-block">Happy drawing!</span>
</p>
</footer>
</main>
</body></html>
